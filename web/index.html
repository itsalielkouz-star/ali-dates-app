<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="شركة مصنع تمور علي - التطبيق الرسمي لإدارة المستودعات والفرز ومتابعة العملاء">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="تمور علي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">

  <title>شركة مصنع تمور علي - Ali Dates</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #013D5A 0%, #001A29 100%);
      overflow: hidden;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .logo-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.4) 0%, rgba(1, 61, 90, 0) 70%);
      animation: pulse 2.2s infinite ease-in-out;
    }

    .logo-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45), 0 0 0 3px #D97706;
      overflow: hidden;
      z-index: 2;
    }

    .logo-circle img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    .spinner {
      position: absolute;
      width: 136px;
      height: 136px;
      border: 2.5px solid transparent;
      border-top-color: #D97706;
      border-right-color: rgba(217, 119, 6, 0.4);
      border-radius: 50%;
      animation: spin 1.4s linear infinite;
      z-index: 1;
    }

    .app-title {
      font-size: 24px;
      font-weight: 800;
      color: #F8FAFC;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .app-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #D97706;
      margin: 0 0 16px 0;
      letter-spacing: 1px;
    }

    .progress-bar-bg {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, #D97706, #F59E0B);
      border-radius: 99px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }

    .loading-hint {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 400;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.25); opacity: 0.9; }
    }

    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <div class="spinner"></div>
      <div class="logo-circle">
        <img src="icons/Icon-192.png" alt="تمور علي - Ali Dates Logo">
      </div>
    </div>
    <h1 class="app-title">شركة مصنع تمور علي</h1>
    <div class="app-subtitle">ALI DATES FACTORY CO.</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="loading-hint">جاري تحميل النظام السحابي وإعداد البيانات...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
